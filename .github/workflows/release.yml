name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          mkdir -p dist
          zip -r dist/nuki_mqtt_events.zip custom_components README.md CHANGELOG.md LICENSE hacs.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nuki_mqtt_events.zip
          generate_release_notes: true
